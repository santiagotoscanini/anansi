# Validates every PR + every push to main: lint, typecheck, build.
# Runs on the self-hosted runner (s2-server) — an ephemeral container
# per job, so each run starts clean like a hosted runner.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # JWT_SECRET is required at module-load by src/lib/auth-server.ts —
        # any 32+ char string is fine for a build-only smoke. Real secret
        # is injected at deploy time, never set here.
        env:
          JWT_SECRET: ci-build-only-secret-not-used-for-real-auth-32chars
        run: npm run build
