# Validates every PR, and gates every release: format, lint, typecheck,
# build, plus a client-bundle boundary check. Runs on the self-hosted
# runner (s2-server) — an ephemeral container per job, so each run starts
# clean like a hosted runner.
#
# There is deliberately NO `push: branches: [main]` trigger here. Release
# calls this workflow as a job (`uses: ./.github/workflows/ci.yml`) and
# gates the image build on it, so a push to main validates exactly once
# and a red result stops the deploy. Adding a push trigger back would run
# the whole thing twice per merge and re-create the race where the image
# ships while CI is still red.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Order matters: pnpm/action-setup must run BEFORE setup-node, because
      # `cache: pnpm` needs the pnpm binary on PATH to locate the store.
      # Version comes from package.json "packageManager".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      # --frozen-lockfile fails rather than silently re-resolving if the
      # lockfile and package.json have drifted. It does NOT exempt this step
      # from the supply-chain cooldown in pnpm-workspace.yaml: pnpm re-verifies
      # every lockfile entry against the policy on each install and fails with
      # ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION if one is too young. So a
      # lockfile committed with the cooldown disabled locally is caught here,
      # which is the point — see the same note in the Dockerfile.
      #
      # Resolves through the self-hosted Verdaccio — `registry:` in
      # pnpm-workspace.yaml, not a flag here, so CI, the Docker build and local
      # dev share one gate. A PR is therefore validated against exactly the
      # artifacts a release will ship, and Verdaccio being down fails CI rather
      # than being quietly worked around.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # format:check first: a formatting failure is the cheapest to diagnose,
      # and it stops a reformat-only diff from being blamed on lint or types.
      - name: Format check
        run: pnpm format:check

      # routeTree.gen.ts is generated and gitignored, so a clean checkout does
      # not have it — and the typed ESLint rules need it. Without this step every
      # `Route.useSearch()` / `createFileRoute()` resolves to an error type and
      # lint fails with ~111 no-unsafe-* errors that say nothing about the real
      # code. It passes locally only because a previous `pnpm dev` or
      # `pnpm typecheck` left the file on disk.
      #
      # `pnpm typecheck` runs `tsr generate` itself, so only Lint needs this —
      # but generating once here keeps the two steps independent of each other's
      # ordering.
      - name: Generate route tree
        run: pnpm generate-routes

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The MCP tool catalog is a public contract: renaming a tool or changing an
      # inputSchema breaks already-connected clients, and nothing else in this
      # pipeline can see it. The catalog is produced by converting Zod shapes to
      # JSON Schema at runtime, so both `tsc` and `vite build` pass while it is
      # broken — the zod 4 upgrade made `tools/list` throw outright, and only this
      # check caught it.
      #
      # Runs in-process against a fake user id, so it needs no server, no database
      # and no OAuth token. Placed before Build because it is seconds, not minutes.
      - name: Check MCP tool catalog
        run: pnpm check:mcp-tools

      # The build needs these present but not real. src/lib/env.ts validates at
      # import time, and the build imports the server graph while collecting
      # page data, so an unset DATABASE_URL fails the build rather than
      # deferring to runtime. Nothing connects to a database here; the values
      # only have to satisfy the schema (AUTH_SECRET has a 32-char minimum).
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-placeholder-secret-not-used-for-anything-real

      # The client/server boundary, checked against the artefact rather than
      # the source. `import "server-only"` used to enforce this and had to go
      # (it throws under Vite); the ESLint no-restricted-imports rule catches
      # the direct case, but only this catches a leak that arrives through a
      # transitive import. If any of these strings is in a browser chunk, a
      # server module got bundled — and with it, potentially, a secret.
      #
      # The env names are checked as VALUES: the placeholders above are what
      # would have been inlined, so a hit means the build baked an env var
      # into client JS.
      - name: Check client bundle for server-only code
        run: |
          set -euo pipefail
          if grep -rlE 'drizzle-orm|@auth/core|bcryptjs|postgres:' .output/public/; then
            echo "::error::server-only module leaked into the client bundle"
            exit 1
          fi
          if grep -rlE 'ci-placeholder-secret|postgresql://ci' .output/public/; then
            echo "::error::an environment secret was inlined into the client bundle"
            exit 1
          fi
          echo "client bundle is clean"

      # ── Runtime checks ──────────────────────────────────────────────────────
      #
      # Everything above this line inspects source or build artefacts. These two
      # boot the built server and drive a real browser at it, because what they
      # guard is invisible to a build BY CONSTRUCTION:
      #
      #   - check-fonts: every font stack in globals.css ends in `Georgia, serif`
      #     / `ui-sans-serif`, so a wrong @fontsource family name renders the
      #     whole app in a fallback face with no error anywhere.
      #   - check-i18n: i18next answers a missing bundle by rendering the raw key
      #     path ("landing.hero.title") and carrying on — still HTTP 200.
      #
      # No database: the marketing page and the auth pages do not query, so the
      # server boots against a deliberately unreachable URL. (check-shell.mjs is
      # NOT here — it signs in and loads /app, so it needs a real Postgres and a
      # seeded user. Run it locally; see CLAUDE.md.)
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      # Keyed on the playwright version because each release pins an exact
      # chromium revision — a stale cache does not fail at install time, it
      # fails at browser launch with "Executable doesn't exist at ...".
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Runtime checks (fonts, i18n)
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:59999/ci
          AUTH_SECRET: ci-placeholder-secret-not-used-for-anything-real
          # The scripts otherwise go hunting through the npx cache for a
          # playwright install; point them at the one in the lockfile.
          PLAYWRIGHT_PATH: ${{ github.workspace }}/node_modules/playwright
        run: |
          set -euo pipefail
          node .output/server/index.mjs &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3000/ || { echo "::error::built server never came up"; exit 1; }
          node scripts/check-fonts.mjs http://localhost:3000/
          node scripts/check-i18n.mjs http://localhost:3000/
