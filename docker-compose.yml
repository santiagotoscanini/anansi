services:
  app:
    container_name: goals-app
    build: .
    ports:
      - "${APP_PORT:-14711}:80"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-goals_db}
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    container_name: goals-db
    image: postgres:17.2-alpine
    restart: unless-stopped
    ports:
      - "${DB_PORT:-15822}:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-goals_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-goals_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
