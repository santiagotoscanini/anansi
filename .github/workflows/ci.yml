# Validates every PR + every push to main: lint, typecheck, build.
# Runs on the self-hosted runner (s2-server) — an ephemeral container
# per job, so each run starts clean like a hosted runner.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Order matters: pnpm/action-setup must run BEFORE setup-node, because
      # `cache: pnpm` needs the pnpm binary on PATH to locate the store.
      # Version comes from package.json "packageManager".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      # --frozen-lockfile fails rather than silently re-resolving if the
      # lockfile and package.json have drifted. It also means the supply-chain
      # cooldown in pnpm-workspace.yaml never applies here — cooldown gates
      # resolution, and a satisfied lockfile does none.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
