name: iOS deploy to TestFlight

# Ships every green iOS CI run of main. Set the repo variable IOS_DEPLOY_ENABLED=true once the
# App Store Connect secrets are in place (ios/scripts/setup-ci.sh does both).
on:
  workflow_run:
    workflows: [iOS CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-deploy
  cancel-in-progress: false

env:
  XCODE_VERSION: '27.0' # keep in sync with local Xcode

defaults:
  run:
    working-directory: ios

jobs:
  testflight:
    name: Archive & upload
    if: >-
      vars.IOS_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: xcode-27 # GitHub's arm64 image with Xcode 27; move to macos-27 when it ships
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Install App Store Connect API key
        run: echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      # The App ID must have every capability the entitlements name (Apple Health since November 2026), or
      # the export's cloud-made profile cannot carry them. Idempotent.
      - name: App ID capabilities
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          node scripts/asc-capability.mjs com.santiagotoscanini.anansi HEALTHKIT
          # The widget extension (the recording's Live Activity, the Control Center control): no capability, but
          # cloud signing needs its App ID to exist.
          node scripts/asc-capability.mjs com.santiagotoscanini.anansi.Widgets
          # The Apple Watch app and its complication (no capabilities either).
          node scripts/asc-capability.mjs com.santiagotoscanini.anansi.watchkitapp
          node scripts/asc-capability.mjs com.santiagotoscanini.anansi.watchkitapp.Widgets

      # Archive unsigned, sign at export. A signed archive needs an Apple Development certificate whose
      # private key is on the machine; a fresh runner has none, so cloud signing minted a new one every
      # run until the account hit its certificate limit (2026-11-13). Export signs with the
      # cloud-managed distribution certificate through the API key (Admin role), which needs no local
      # key. An unsigned archive carries no entitlements, so the step after it signs the app ad hoc (no
      # certificate) with Config/Anansi.entitlements, and the export keeps them in its signature.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Anansi.xcodeproj \
            -scheme Anansi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Anansi.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} + 100 ))

      # Inner code first, then what holds it (no --deep): codesign refuses to sign a bundle holding unsigned code.
      # The Apple Watch app (Watch/, with its complication inside) and the widget extensions have no entitlements of
      # their own; the export re-signs each with its own profile.
      - name: Entitlements into the archive
        run: |
          set -o pipefail
          APP=build/Anansi.xcarchive/Products/Applications/Anansi.app
          for WATCH in "$APP"/Watch/*.app; do
            [ -d "$WATCH" ] || continue
            for EXT in "$WATCH"/PlugIns/*.appex; do
              [ -d "$EXT" ] || continue
              codesign --force --sign - --timestamp=none "$EXT"
            done
            codesign --force --sign - --timestamp=none "$WATCH"
          done
          for EXT in "$APP"/PlugIns/*.appex; do
            [ -d "$EXT" ] || continue
            codesign --force --sign - --timestamp=none "$EXT"
          done
          codesign --force --sign - --entitlements Config/Anansi.entitlements --timestamp=none "$APP"
          codesign -d --entitlements - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Export & upload to App Store Connect
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Anansi.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Summary
        run: |
          echo "### Uploaded build $(( ${{ github.run_number }} + 100 )) to TestFlight :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Processing takes ~5–15 min; TestFlight will notify internal testers." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
