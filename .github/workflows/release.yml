# Builds + publishes a linux/amd64 Docker image to the box's own OCI
# registry (zot) on every push to main and on manual dispatch. The
# runner and the registry share a podman bridge — the push never
# leaves the server; s2-server's deploy timer picks the image up
# within ~2 minutes and restarts the container.
#
# Tags applied:
#   - latest          (the one tag the deploy loop follows)
#
# Layer cache lives in the registry itself (cache/anansi repo), so
# incremental rebuilds stay fast despite ephemeral runners.
#
# No build-time env vars are needed. All secrets are read server-side at
# runtime. Set DATABASE_URL and AUTH_SECRET at `docker run` time.

name: Release image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: zot:5000/${{ github.event.repository.name }}
  CACHE: zot:5000/cache/${{ github.event.repository.name }}

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to registry
        run: podman login zot:5000 -u ci --password-stdin <<< "${{ secrets.REGISTRY_PASSWORD }}"

      - name: Build image
        run: |
          podman build \
            --layers --cache-to "$CACHE" --cache-from "$CACHE" \
            --label "org.opencontainers.image.title=anansi" \
            --label "org.opencontainers.image.description=Personal operating system for goals, relationships, and values." \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --tag "$IMAGE:latest" \
            .

      - name: Push image
        run: podman push "$IMAGE:latest"

      - name: Image summary
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
