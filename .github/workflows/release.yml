# Builds + publishes a linux/amd64 Docker image to the box's own OCI
# registry (zot) on every push to main and on manual dispatch. The
# runner and the registry share a podman bridge — the push never
# leaves the server; s2-server's deploy timer picks the image up
# within ~2 minutes and restarts the container.
#
# Tags applied:
#   - latest          (the one tag the deploy loop follows)
#
# Layer cache lives in the registry itself (cache/anansi repo), so
# incremental rebuilds stay fast despite ephemeral runners.
#
# No build args and no build-time secrets. All secrets are read server-side at
# runtime; set DATABASE_URL and AUTH_SECRET at `docker run` time.
#
# Dependencies resolve through the self-hosted Verdaccio, which is pinned in
# pnpm-workspace.yaml rather than passed in here — so this build, CI and local
# dev all go through the same gate and no environment can opt out. Verdaccio
# being unreachable fails this job by design; see the note on the build step.
#
# Nothing ships unvalidated: `build-and-push` needs the `validate` job,
# which is the CI workflow reused wholesale. Previously CI and Release both
# triggered on push to main and ran in parallel, so a red CI did not stop
# the image — main deployed with 111 lint errors outstanding.

name: Release image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: zot:5000/${{ github.event.repository.name }}
  CACHE: zot:5000/cache/${{ github.event.repository.name }}

jobs:
  # The same steps PRs run — one definition, so the gate can never drift
  # from what CI actually checks. Also runs on workflow_dispatch, so a
  # manual release is validated too.
  validate:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: validate
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to registry
        run: podman login zot:5000 -u ci --password-stdin <<< "${{ secrets.REGISTRY_PASSWORD }}"

      # No --build-arg for the registry. pnpm-workspace.yaml pins `registry:` to
      # the self-hosted Verdaccio, so this build resolves through it the same way
      # local dev and CI do, and there is deliberately NO fallback to npmjs: a
      # gate that silently routes around itself is not a gate. If Verdaccio is
      # down this job fails, and the fix is the proxy, not the pipeline.
      - name: Build image
        run: |
          META=(
            "org.opencontainers.image.title=anansi"
            "org.opencontainers.image.description=Personal operating system for goals, relationships, and values."
            "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
            "org.opencontainers.image.url=https://github.com/${{ github.repository }}"
            "org.opencontainers.image.vendor=Santiago Toscanini"
            "org.opencontainers.image.licenses=UNLICENSED"
            "org.opencontainers.image.revision=${{ github.sha }}"
          )
          ARGS=()
          for m in "${META[@]}"; do ARGS+=(--annotation "$m" --label "$m"); done
          podman build \
            --layers --cache-to "$CACHE" --cache-from "$CACHE" \
            "${ARGS[@]}" \
            --tag "$IMAGE:latest" \
            .

      - name: Push image
        run: podman push "$IMAGE:latest"

      - name: Image summary
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
