name: iOS deploy to TestFlight

# Ships every green iOS CI run of main. Set the repo variable IOS_DEPLOY_ENABLED=true once the
# App Store Connect secrets are in place (ios/scripts/setup-ci.sh does both).
on:
  workflow_run:
    workflows: [iOS CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-deploy
  cancel-in-progress: false

env:
  XCODE_VERSION: '27.0' # keep in sync with local Xcode

defaults:
  run:
    working-directory: ios

jobs:
  testflight:
    name: Archive & upload
    if: >-
      vars.IOS_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: xcode-27 # GitHub's arm64 image with Xcode 27; move to macos-27 when it ships
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Install App Store Connect API key
        run: echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      # Archive unsigned, sign at export. A signed archive needs an Apple Development certificate whose
      # private key is on the machine; a fresh runner has none, so cloud signing minted a new one every
      # run until the account hit its certificate limit (2026-11-13). Export signs with the
      # cloud-managed distribution certificate through the API key (Admin role), which needs no local
      # key. This holds while the app has no entitlements: an unsigned archive carries none.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Anansi.xcodeproj \
            -scheme Anansi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Anansi.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} + 100 ))

      - name: Export & upload to App Store Connect
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Anansi.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Summary
        run: |
          echo "### Uploaded build $(( ${{ github.run_number }} + 100 )) to TestFlight :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Processing takes ~5–15 min; TestFlight will notify internal testers." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
