# Builds and publishes a Docker image to GitHub Container Registry whenever
# the version in package.json changes on `main`. Pair with `santree` (or any
# version-bump command that lands a commit modifying package.json's `version`
# field) to ship a new image without manual workflow_dispatch.
#
# The image is tagged with the new version (e.g. `v0.2.0`), the major.minor
# (e.g. `v0.2`), the major (e.g. `v0`), and `latest`. Pull from
# `ghcr.io/<owner>/<repo>:latest` on the NAS — no need to clone the repo.
name: Publish Docker image

on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: detect
        run: |
          NEW=$(jq -r .version package.json)
          OLD=$(git show HEAD~1:package.json 2>/dev/null | jq -r .version 2>/dev/null || echo "")
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          if [ "$NEW" != "$OLD" ] && [ -n "$NEW" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version: $OLD -> $NEW"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version change ($NEW)"
          fi

      - name: Set up Docker Buildx
        if: steps.detect.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.detect.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: steps.detect.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern=v{{version}},value=${{ steps.detect.outputs.new }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ steps.detect.outputs.new }}
            type=semver,pattern=v{{major}},value=${{ steps.detect.outputs.new }}

      - name: Build and push
        if: steps.detect.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
