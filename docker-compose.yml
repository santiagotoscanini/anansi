networks:
  traefik_network:
    external: true
  internal:
    driver: bridge

services:
  db:
    container_name: goals-db
    # Migrate to Postgres 18 when it's stable
    image: postgres:17.2-alpine
    restart: unless-stopped
    networks:
      - internal
    environment:
      - POSTGRES_USER=${DB_USER:-user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-goals_db}
    volumes:
      - /home/santiago/selfhost/goals_app/pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-goals_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    container_name: goals-app
    build: .
    networks:
      - traefik_network
      - internal
    ports:
      - "${APP_PORT:-14711}:80"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-goals_db}
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      - "/s2/santi/2. Files/2.8 Goals app:/app/uploads/x75hzierondup9um0n2kktaa"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.goals-web.rule=Host(`goals.s2.toscanini.me`)"
      - "traefik.http.routers.goals-web.entrypoints=websecure"
      - "traefik.http.routers.goals-web.tls=true"

volumes:
  postgres_data:
