# Validates every PR + every push to main: lint, typecheck, build.
# Runs on the self-hosted runner (s2-server) — an ephemeral container
# per job, so each run starts clean like a hosted runner.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Order matters: pnpm/action-setup must run BEFORE setup-node, because
      # `cache: pnpm` needs the pnpm binary on PATH to locate the store.
      # Version comes from package.json "packageManager".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      # --frozen-lockfile fails rather than silently re-resolving if the
      # lockfile and package.json have drifted. It also means the supply-chain
      # cooldown in pnpm-workspace.yaml never applies here — cooldown gates
      # resolution, and a satisfied lockfile does none.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # format:check first: a formatting failure is the cheapest to diagnose,
      # and it stops a reformat-only diff from being blamed on lint or types.
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The build needs these present but not real. src/lib/env.ts validates at
      # import time, and the build imports the server graph while collecting
      # page data, so an unset DATABASE_URL fails the build rather than
      # deferring to runtime. Nothing connects to a database here; the values
      # only have to satisfy the schema (AUTH_SECRET has a 32-char minimum).
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-placeholder-secret-not-used-for-anything-real

      # The client/server boundary, checked against the artefact rather than
      # the source. `import "server-only"` used to enforce this and had to go
      # (it throws under Vite); the ESLint no-restricted-imports rule catches
      # the direct case, but only this catches a leak that arrives through a
      # transitive import. If any of these strings is in a browser chunk, a
      # server module got bundled — and with it, potentially, a secret.
      #
      # The env names are checked as VALUES: the placeholders above are what
      # would have been inlined, so a hit means the build baked an env var
      # into client JS.
      - name: Check client bundle for server-only code
        run: |
          set -euo pipefail
          if grep -rlE 'drizzle-orm|@auth/core|bcryptjs|postgres:' .output/public/; then
            echo "::error::server-only module leaked into the client bundle"
            exit 1
          fi
          if grep -rlE 'ci-placeholder-secret|postgresql://ci' .output/public/; then
            echo "::error::an environment secret was inlined into the client bundle"
            exit 1
          fi
          echo "client bundle is clean"
